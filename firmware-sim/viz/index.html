<!DOCTYPE html>
<meta charset="utf-8">
<title>micromouse sim</title>
<!--
  The client half of viz/server.py.

  Everything is drawn in the world's own *image pixel* space, using the same
  world_to_px mapping GridGeometry uses, and the canvas transform then scales
  that to the screen. Doing it that way rather than converting to screen
  coordinates by hand means the x_axis convention is handled in exactly one
  place, and the occupancy bitmap -- which is already in image space -- needs no
  conversion at all.

  Trails arrive as deltas against a cursor the server keeps per connection, so a
  long run does not re-send its whole history sixty times a second.
-->
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2a2e37; --text: #e6e8ec;
    --dim: #8b919c; --true: #4a9eff; --est: #ff5c5c; --plan: #ffb020;
    --wall: #454b57; --map: #2f6b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg);
    color: var(--text); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  aside {
    width: 280px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto;
  }
  h1 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  p.sub { margin: 0 0 14px; color: var(--dim); font-size: 11px; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 16px 0 4px; font-weight: 600;
  }
  .buttons { display: flex; gap: 6px; margin-top: 6px; }
  button {
    flex: 1; background: #262a33; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 0; cursor: pointer; font: inherit; font-size: 11px;
  }
  button:hover { background: #303540; }
  input[type=range] { width: 100%; }
  .key { display: flex; align-items: center; gap: 6px; padding: 1px 0; font-size: 11px; }
  .sw { width: 14px; height: 3px; border-radius: 2px; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 1px 0; }
  #done { color: var(--plan); font-size: 11px; min-height: 1.5em; }
</style>

<div id="stage"><canvas id="c"></canvas></div>

<aside>
  <h1 id="scenario">connecting…</h1>
  <p class="sub" id="description"></p>

  <h2>pose</h2>
  <div class="row"><span>t</span><span id="t">—</span></div>
  <div class="row"><span>true</span><span id="true">—</span></div>
  <div class="row"><span>estimate</span><span id="est">—</span></div>
  <div class="row"><span>error</span><span id="err">—</span></div>
  <div class="row"><span>segment</span><span id="seg">—</span></div>
  <div id="done"></div>

  <h2>lidar</h2>
  <div class="row"><span>front</span><span id="front">—</span></div>
  <div class="row"><span>left</span><span id="left">—</span></div>
  <div class="row"><span>right</span><span id="right">—</span></div>

  <h2>run</h2>
  <div class="buttons">
    <button id="playpause">pause</button>
    <button id="step">step</button>
    <button id="reset">reset</button>
  </div>
  <div class="row" style="margin-top:10px"><span>speed</span><span id="speedv">1.0x</span></div>
  <input type="range" id="speed" min="-2" max="2" step="0.05" value="0">

  <h2>layers</h2>
  <label class="chk"><input type="checkbox" id="l-map"> built map</label>
  <label class="chk"><input type="checkbox" id="l-beams" checked> lidar beams</label>
  <label class="chk"><input type="checkbox" id="l-trail" checked> trails</label>

  <h2>key</h2>
  <div class="key"><i class="sw" style="background:var(--true)"></i>true pose</div>
  <div class="key"><i class="sw" style="background:var(--est)"></i>estimate</div>
  <div class="key"><i class="sw" style="background:var(--plan)"></i>planned path</div>
  <div class="key"><i class="sw" style="background:var(--map)"></i>map built from readings</div>
</aside>

<script>
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");

// World +x in image space as (column step, row step); +y is a quarter turn CCW
// on screen. Mirrors _X_AXES in world.py.
const X_AXES = { up: [0,-1], down: [0,1], right: [1,0], left: [-1,0] };

let W = null;                       // /world payload
let ex = [1,0], ey = [0,-1];
let trueTrail = [], estTrail = [];
let last = null, gen = -1;
let occupied = null, built = null;  // offscreen bitmaps

const toPx = (x, y) => [
  W.origin_px[0] + (x*ex[0] + y*ey[0]) / W.mm_per_pixel,
  W.origin_px[1] + (x*ex[1] + y*ey[1]) / W.mm_per_pixel,
];
const dirPx = th => {
  const c = Math.cos(th), s = Math.sin(th);
  return [c*ex[0] + s*ey[0], c*ex[1] + s*ey[1]];
};

/* An RLE run list -> a canvas of W.width x W.height, `colour` where set. */
function bitmap(rle, colour) {
  const cv = document.createElement("canvas");
  cv.width = W.width; cv.height = W.height;
  const img = ctx.createImageData(W.width, W.height);
  const [r, g, b, a] = colour;
  let i = 0, set = false;
  for (const run of rle) {
    if (set) for (let k = 0; k < run; k++) {
      const o = (i + k) * 4;
      img.data[o] = r; img.data[o+1] = g; img.data[o+2] = b; img.data[o+3] = a;
    }
    i += run; set = !set;
  }
  cv.getContext("2d").putImageData(img, 0, 0);
  return cv;
}

function fit() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  draw();
}
window.addEventListener("resize", fit);

function draw() {
  if (!W) return;
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.width / dpr, ch = canvas.height / dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--bg");
  ctx.fillRect(0, 0, cw, ch);

  // Fit the whole grid, preserving aspect. Everything below is in image px.
  const k = Math.min(cw / W.width, ch / W.height) * 0.96;
  ctx.translate((cw - W.width*k) / 2, (ch - W.height*k) / 2);
  ctx.scale(k, k);
  const mm = 1 / W.mm_per_pixel;              // image px per mm
  const px = 1 / k;                           // one screen px, in image px

  ctx.imageSmoothingEnabled = false;
  if (occupied) ctx.drawImage(occupied, 0, 0);
  if (built && $("l-map").checked) ctx.drawImage(built, 0, 0);

  // planned geometry
  const geo = W.geometry || {};
  if (geo.kind === "segments") {
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--plan");
    ctx.lineWidth = 2 * px;
    ctx.globalAlpha = 0.75;
    for (const s of geo.segments) {
      const a = toPx(s.start[0], s.start[1]), b = toPx(s.end[0], s.end[1]);
      ctx.beginPath();
      if (s.curvature > 1e-3) {
        const c = toPx(s.centre[0], s.centre[1]);
        const r = (1 / s.curvature) * mm;
        let a0 = Math.atan2(a[1]-c[1], a[0]-c[0]), a1 = Math.atan2(b[1]-c[1], b[0]-c[0]);
        // The image y axis may be flipped relative to the world, which
        // reverses the sense of every arc with it.
        const flipped = (ex[0]*ey[1] - ex[1]*ey[0]) > 0;
        ctx.arc(c[0], c[1], r, a0, a1, s.direction === "left" ? !flipped : flipped);
      } else {
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (geo.kind === "grid") {
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--plan");
    for (const t of geo.targets) {
      const p = toPx(t.world[0], t.world[1]);
      ctx.beginPath(); ctx.arc(p[0], p[1], 3*px, 0, 7); ctx.fill();
    }
  }

  if ($("l-trail").checked) {
    trail(estTrail, "--est", 1.5*px);
    trail(trueTrail, "--true", 1.5*px);
  }

  if (last) {
    if ($("l-beams").checked) beams(last.est, last.readings, mm, px);
    robot(last.est, "--est", mm, px, true);
    robot(last.true, "--true", mm, px, false);
  }
}

function trail(pts, colour, width) {
  if (pts.length < 2) return;
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue(colour);
  ctx.lineWidth = width;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 2) {
    const p = toPx(pts[i], pts[i+1]);
    i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* Beams from the ESTIMATED pose: that is where the robot believes its sensors
   are, and so where a reading would place a wall. Divergence from the true
   pose is exactly the estimator error. */
function beams(pose, readings, mm, px) {
  if (!readings) return;
  const [x, y, th] = pose;
  ctx.lineWidth = px;
  for (const [name, mount] of Object.entries(W.mounts)) {
    const d = readings[name];
    if (d === undefined) continue;
    const c = Math.cos(th), s = Math.sin(th);
    const ox = x + mount[0]*c - mount[1]*s, oy = y + mount[0]*s + mount[1]*c;
    const h = th + mount[2];
    const a = toPx(ox, oy), b = toPx(ox + d*Math.cos(h), oy + d*Math.sin(h));
    const saturated = d >= W.lidar_max;
    ctx.strokeStyle = saturated ? "rgba(255,92,92,0.18)" : "rgba(255,92,92,0.55)";
    ctx.setLineDash(saturated ? [3*px, 3*px] : []);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function robot(pose, colour, mm, px, hollow) {
  const [x, y, th] = pose;
  const p = toPx(x, y), d = dirPx(th);
  const r = (W.axle_len / 2) * mm;
  const col = getComputedStyle(document.body).getPropertyValue(colour);
  ctx.lineWidth = 1.5 * px;
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7);
  if (hollow) { ctx.strokeStyle = col; ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1; }
  ctx.strokeStyle = col;
  ctx.beginPath();
  ctx.moveTo(p[0], p[1]);
  ctx.lineTo(p[0] + d[0]*r*1.9, p[1] + d[1]*r*1.9);
  ctx.stroke();
}

/* ------------------------------------------------------------------ data */
const deg = r => (r * 180 / Math.PI).toFixed(1);
const fmt = p => `${p[0].toFixed(0)}, ${p[1].toFixed(0)}, ${deg(p[2])}°`;

async function boot() {
  W = await (await fetch("/world")).json();
  [ex] = [X_AXES[W.x_axis] || X_AXES.up];
  ey = [ex[1], -ex[0]];
  occupied = bitmap(W.rle, [69, 75, 87, 255]);
  $("scenario").textContent = W.scenario;
  $("description").textContent = W.description;
  fit();
  stream();
  setInterval(refreshMap, 1000);
}

async function refreshMap() {
  if (!$("l-map").checked) return;
  const m = await (await fetch("/map")).json();
  built = bitmap(m.rle, [47, 107, 79, 190]);
}

function stream() {
  const es = new EventSource("/stream");
  es.onmessage = e => {
    const f = JSON.parse(e.data);
    // A reset bumps the generation and rewinds the server's cursor; drop what
    // we have rather than splicing a new run onto the tail of the old one.
    if (f.gen !== gen || f.reset) { trueTrail = []; estTrail = []; gen = f.gen; }
    trueTrail.push(...f.trail_true);
    estTrail.push(...f.trail_est);
    last = f;

    $("t").textContent = f.t.toFixed(2) + " s";
    $("true").textContent = fmt(f.true);
    $("est").textContent = fmt(f.est);
    $("err").textContent = f.error.toFixed(1) + " mm";
    $("seg").textContent = f.planner_idx;
    $("done").textContent = f.done ? "planner idle — run complete" : "";
    for (const k of ["front", "left", "right"]) {
      const v = f.readings ? f.readings[k] : undefined;
      $(k).textContent = v === undefined ? "—"
        : (v >= W.lidar_max ? `${v} (no target)` : `${v} mm`);
    }
    $("playpause").textContent = f.paused ? "play" : "pause";
    draw();
  };
  es.onerror = () => { $("done").textContent = "stream lost — reconnecting"; };
}

const control = body =>
  fetch("/control", { method: "POST", body: JSON.stringify(body) });

$("playpause").onclick = () =>
  control({ action: last && last.paused ? "resume" : "pause" });
$("step").onclick = () => control({ action: "step", steps: 50 });
$("reset").onclick = () => control({ action: "reset" });
$("speed").oninput = e => {
  const v = Math.pow(10, +e.target.value);      // log scale, 0.01x .. 100x
  $("speedv").textContent = v.toFixed(v < 1 ? 2 : 1) + "x";
  control({ speed: v });
};
$("l-map").onchange = e => { if (e.target.checked) refreshMap(); else built = null; draw(); };
$("l-beams").onchange = $("l-trail").onchange = draw;

document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); $("playpause").click(); }
  if (e.key === "s") $("step").click();
  if (e.key === "r") $("reset").click();
});

boot();
</script>
